<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F9FE">
<title>Cuaderno de Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F6F9FE; --rejilla:#DCE6F6; --tinta:#17246B; --lapiz:#4B5678; --linea:#BFCDE8;
  --tarjeta:#FFFFFF; --margen:#E5484D; --resalt:#FFE066;
  --ok:#1E9E6A; --ok-btn:#147A52; --ok-bg:#DDF4E8; --ok-tx:#0F6B47;
  --err:#C9303B; --err-bg:#FCE3E4; --err-tx:#A31F2A;
  --codigo-bg:#111B4A; --codigo-tx:#E9EEFF; --codigo-dim:#8C9AD1;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --papel:#0E1330; --rejilla:#1A2354; --tinta:#E9EEFF; --lapiz:#A9B4DD; --linea:#33407F;
    --tarjeta:#161D45; --margen:#FF6B75;
    --ok:#4FD69C; --ok-bg:#12382B; --ok-tx:#7BE5B8;
    --err:#FF7A84; --err-bg:#43191D; --err-tx:#FF9AA1;
    --codigo-bg:#0A0F2B;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100%;
  font-family:var(--sans); font-size:17px; line-height:1.5; color:var(--tinta);
  background-color:var(--papel);
  background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh}
b{font-weight:800}
code{font-family:var(--mono);font-size:.9em;background:var(--rejilla);padding:1px 6px;border-radius:6px}
svg{display:block}

/* ---------- Ruta ---------- */
.barra{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; background:var(--papel); border-bottom:2px solid var(--tinta);
}
.marca{font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.1}
.datos{display:flex;gap:8px;align-items:center}
.dato{display:flex;align-items:center;gap:6px;font-weight:800;padding:5px 10px;border:2px solid var(--tinta);border-radius:999px;background:var(--tarjeta);font-size:16px}
.snd{flex:0 0 auto;display:grid;place-items:center;width:42px;height:38px;border:2px solid var(--tinta);border-radius:999px;background:var(--tarjeta);color:var(--tinta);cursor:pointer}
.lec-top .snd{height:42px;border-radius:12px}
.ruta .unidad{align-self:stretch;position:relative;z-index:1;margin:0 16px;padding:16px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:14px;box-shadow:4px 4px 0 var(--tinta)}
.u-cab{display:flex;align-items:center;gap:12px;width:100%;padding:0;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.u-txt{flex:1;min-width:0}
.u-tit{display:flex;align-items:center;gap:8px;font-size:24px;line-height:1.15;font-weight:800}
.u-desc{display:block;margin-top:2px;color:var(--lapiz);font-size:15px}
.chev{flex:0 0 auto;transition:transform .2s}
.u-cab[aria-expanded="true"] .chev{transform:rotate(180deg)}
.u-lecs{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:26px;padding:6px 0 4px}
.u-lecs[hidden]{display:none}
.ruta .unidad.proximo{border-style:dashed;border-color:var(--linea);box-shadow:none;background:transparent}
.unidad.proximo .u-tit{color:var(--lapiz)}
.aviso{margin:14px 16px 0;padding:12px 14px;background:var(--resalt);color:#17246B;border:2px solid var(--tinta);border-radius:12px;font-size:15px;line-height:1.4}
.aviso b{display:block}
.acc-barra{display:flex;justify-content:flex-end;gap:14px;padding:8px 16px 0}
.meter{margin-top:12px;height:10px;border-radius:99px;background:var(--rejilla);border:2px solid var(--tinta);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.ruta{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:20px 0 40px}
.trazo{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.trazo path{fill:none;stroke:var(--linea);stroke-width:5;stroke-dasharray:1 11;stroke-linecap:round}
.trazo path.hecho{stroke:var(--ok)}
.nodo{
  position:relative; z-index:1; width:150px; padding:0; border:0; background:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  transform:translateX(var(--dx,0px));
}
.nodo:disabled{cursor:default}
.hexw{filter:drop-shadow(3px 4px 0 var(--tinta))}
.hex{display:grid;place-items:center;width:78px;height:86px;background:var(--tinta);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex i{display:grid;place-items:center;width:68px;height:76px;background:var(--tarjeta);color:var(--tinta);font-style:normal;font-weight:800;font-size:26px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.nodo.hecho .hex i{background:var(--ok-btn);color:#fff}
.nodo.actual .hex i{background:var(--resalt);color:#17246B}
.nodo.quiz:not(.bloq) .hex{background:var(--margen)}
.nodo.bloq .hexw{filter:drop-shadow(3px 4px 0 var(--linea))}
.nodo.bloq .hex{background:var(--linea)}
.nodo.bloq .hex i{background:var(--rejilla);color:var(--lapiz)}
.nodo .nombre{font-weight:600;font-size:15px;line-height:1.2;text-align:center;background:var(--papel);padding:2px 8px;border-radius:8px}
.nodo.bloq .nombre{color:var(--lapiz)}
.burbuja{position:relative;background:var(--tinta);color:var(--papel);padding:3px 12px;border-radius:8px;font-weight:800;font-size:15px}
.burbuja::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--tinta)}
.nota{margin:0 16px;padding-bottom:28px;text-align:center;color:var(--lapiz);font-size:14px}
.enlace{background:none;border:0;padding:4px;text-decoration:underline;cursor:pointer;color:var(--lapiz);font-size:14px}

/* ---------- Bienvenida ---------- */
.bv{display:flex;flex-direction:column;min-height:100vh;padding:32px 20px 28px}
.bv-cuerpo{flex:1}
.bv h1{margin:0 0 12px;font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.bv p{margin:0 0 16px;max-width:60ch}
.bv .cod{margin:22px 0 10px}
.bv .sal{margin:0 0 14px}
.puntos{display:flex;gap:8px;justify-content:center;margin:18px 0}
.punto{width:10px;height:10px;border-radius:99px;background:var(--linea)}
.punto.act{width:28px;background:var(--tinta)}
.como{list-style:none;margin:22px 0;padding:0}
.como li{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:12px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:12px;box-shadow:3px 3px 0 var(--tinta)}
.como .n{flex:0 0 32px;height:32px;display:grid;place-items:center;background:var(--resalt);color:#17246B;border-radius:50%;font-weight:800}

.copia{padding:28px 20px 40px}
.copia h1{margin:0 0 12px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.copia h2{margin:0 0 6px;font-size:20px;font-weight:800}
.copia p{margin:0 0 12px;max-width:62ch}
.cuadro{display:block;width:100%;padding:10px;background:var(--tarjeta);color:var(--tinta);border:2px solid var(--tinta);border-radius:12px;font:400 14px/1.4 var(--mono);word-break:break-all;resize:vertical}
.msg{min-height:0;margin-bottom:10px;font-weight:600;font-size:15px}
.msg.ok{padding:10px 12px;border-radius:10px;background:var(--ok-bg);color:var(--ok-tx)}
.msg.mal{padding:10px 12px;border-radius:10px;background:var(--err-bg);color:var(--err-tx)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 16px 0;padding:12px 14px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:14px;box-shadow:3px 3px 0 var(--tinta)}
.anillo{flex:0 0 auto;color:var(--tinta)}
.meta-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.meta-txt b{font-size:19px;line-height:1.2}
.meta-txt span{color:var(--lapiz);font-size:15px}
.meta-txt small{color:var(--lapiz);font-size:13px}
.btn-cofre{flex:1 1 100%;padding:12px 14px;background:var(--resalt);color:#17246B;border:2px solid var(--tinta);border-radius:12px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--tinta);animation:tiembla 2.4s ease-in-out infinite}
.btn-cofre:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
.tag-ok{flex:1 1 100%;text-align:center;padding:6px 10px;border-radius:10px;background:var(--ok-bg);color:var(--ok-tx);font-weight:700;font-size:14px}
.meta-fin{margin:0 0 18px;padding:14px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:14px;box-shadow:3px 3px 0 var(--tinta);display:flex;flex-direction:column;gap:10px}
.meta-fin b{font-size:18px}
.meta-fin-txt{margin:0 0 18px!important;color:var(--lapiz);font-size:15px}
.cofre{padding:36px 20px 40px;text-align:center}
.cofre h1{margin:0 0 8px;font-size:32px;line-height:1.1;font-weight:800}
.cofre p{margin:0 0 14px;color:var(--lapiz)}
.cofre-btn{display:block;width:min(72vw,270px);margin:34px auto 10px;padding:0;background:none;border:0;cursor:pointer;animation:tiembla 2.2s ease-in-out infinite}
.cofre-btn:disabled{cursor:default;animation:none}
.cofre-btn svg{width:100%;height:auto;overflow:visible}
#brillo{opacity:0;transition:opacity .5s}
.abierto #brillo{opacity:1}
#tapa{transform-origin:80px 60px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
#tapa.abierta{transform:translate(-4px,-26px) rotate(-14deg)}
.chispas path{opacity:0;transform-box:fill-box;transform-origin:center}
.abierto .chispas path{animation:chispa .8s ease-out forwards}
.premio{margin:4px auto 20px;padding:14px 16px;max-width:290px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:14px;box-shadow:4px 4px 0 var(--tinta);animation:salta .5s cubic-bezier(.3,1.5,.5,1)}
.premio strong{display:block;font-size:46px;line-height:1;font-weight:800}
.premio span{color:var(--lapiz);font-weight:600}
.premio.dorado{background:var(--resalt);color:#17246B}
.premio.dorado span{color:#17246B}
@keyframes tiembla{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-3deg)}94%{transform:rotate(3deg)}97%{transform:rotate(-2deg)}}
@keyframes chispa{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.25) rotate(20deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

/* ---------- Lección ---------- */
.lec-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 16px;background:var(--papel);border-bottom:2px solid var(--tinta)}
.lec-fila{display:flex;align-items:center;gap:12px}
.cerrar{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--tinta);border-radius:12px;background:var(--tarjeta);cursor:pointer}
.progreso{flex:1;display:flex;gap:5px}
.seg-b{flex:1;height:30px;padding:10px 0;border:0;background:none;cursor:pointer}
.seg-b i{display:block;height:10px;border-radius:99px;background:var(--linea)}
.seg-b.hecho i{background:var(--ok)}
.seg-b.actual i{background:var(--tinta)}
.seg-b:disabled{cursor:default}
.lec-nav{display:flex;align-items:center;gap:10px;padding-top:10px}
.nav-flecha{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--tinta);border-radius:12px;background:var(--tarjeta);color:var(--tinta);cursor:pointer}
.nav-flecha:disabled{border-color:var(--linea);color:var(--linea);cursor:default}
.lec-nav-tit{flex:1;min-width:0;display:flex;flex-direction:column;text-align:center}
.lec-nav-tit b{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lec-nav-tit small{color:var(--lapiz);font-size:12.5px;line-height:1.25}
.hoja{position:relative;padding:18px 16px 240px 36px}
.hoja::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margen);opacity:.75}
.hoja h1{margin:0 0 12px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.hoja p{margin:0 0 14px;max-width:62ch}
.sobre{position:relative;margin-left:-20px}
.cod{margin:0 0 14px -20px;padding:12px 14px;background:var(--codigo-bg);color:var(--codigo-tx);border:2px solid var(--tinta);border-radius:12px;font:400 15px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.cod code{background:none;padding:0;font-size:inherit}
.sal{margin:0 0 14px -20px;padding:8px 14px 10px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:12px}
.sal .etq{display:block;font-size:13px;color:var(--lapiz);font-weight:600}
.sal pre{margin:2px 0 0;font:400 15px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.sal.err{border-color:var(--err)}
.sal.err pre{color:var(--err-tx)}
.preg{font-weight:600;font-size:19px}
.ops{display:grid;gap:10px}
.op{width:100%;text-align:left;padding:13px 14px;background:var(--tarjeta);border:2px solid var(--linea);border-radius:12px;cursor:pointer;font-family:var(--mono);font-size:16px}
.op[aria-pressed="true"]{border-color:var(--tinta);background:var(--resalt);color:#17246B}
.op.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-tx)}
.op.mal{border-color:var(--err);background:var(--err-bg);color:var(--err-tx)}
.op:disabled{cursor:default}
.editor{display:block;width:100%;min-height:176px;resize:vertical;margin:0;padding:12px;background:var(--codigo-bg);color:var(--codigo-tx);border:2px solid var(--tinta);border-radius:12px 12px 0 0;font:400 16px/1.55 var(--mono);tab-size:4;white-space:pre;overflow:auto;caret-color:var(--resalt)}
.teclas{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--tarjeta);border:2px solid var(--tinta);border-top:0;border-radius:0 0 12px 12px}
.tecla{flex:0 0 auto;min-width:42px;height:40px;padding:0 10px;border:2px solid var(--linea);border-radius:8px;background:var(--papel);color:var(--tinta);font:600 16px var(--mono);cursor:pointer}
.acciones{display:flex;gap:10px;margin:14px 0}
.btn2{flex:1;padding:11px 12px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--tinta)}
.btn2:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
.btn2:disabled{border-color:var(--linea);color:var(--lapiz);box-shadow:none;cursor:not-allowed}
.pista{margin:0 0 10px -20px;padding:10px 14px;background:var(--resalt);color:#17246B;border-radius:10px;font-weight:600;font-size:15px}
.pista pre{margin:8px 0 0}
.estado{margin:6px 0 0;font-size:14px;color:var(--lapiz)}
.estado[data-e="error"]{color:var(--err-tx);font-weight:600}
.estado[data-e="listo"]{color:var(--ok-tx)}

.pie{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--papel);border-top:2px solid var(--tinta);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pie-in{max-width:560px;margin:0 auto}
.fb{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:10px;border-radius:10px;font-weight:600;font-size:15px;line-height:1.35;animation:entra .18s ease-out}
.fb.ok{background:var(--ok-bg);color:var(--ok-tx)}
.fb.mal{background:var(--err-bg);color:var(--err-tx)}
.fb.mal{animation:entra .18s ease-out,sacude .3s .05s}
.fb b{display:block}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sacude{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{width:100%;padding:14px;background:var(--resalt);color:#17246B;border:2px solid var(--tinta);border-radius:14px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 4px 0 var(--tinta)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn.ok{background:var(--ok-btn);color:#fff}
.btn:disabled{background:var(--rejilla);color:var(--lapiz);border-color:var(--linea);box-shadow:none;cursor:not-allowed}

/* ---------- Fin ---------- */
.fin{padding:48px 24px 40px;text-align:center}
.fin .hexw{display:inline-block;margin-bottom:22px;animation:salta .5s cubic-bezier(.3,1.5,.5,1)}
.fin .hex{width:110px;height:122px}
.fin .hex i{width:98px;height:110px;background:var(--ok-btn);color:#fff;font-size:30px}
.fin .hex.flojo i{background:var(--resalt);color:#17246B}
.fin h1{margin:0 0 6px;font-size:32px;line-height:1.1;font-weight:800}
.fin p{margin:0 0 22px;color:var(--lapiz)}
.res{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.res div{min-width:130px;padding:12px;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:14px;box-shadow:3px 3px 0 var(--tinta)}
.res strong{display:block;font-size:26px;line-height:1.1}
.res span{font-size:14px;color:var(--lapiz)}
.fin .btn{margin-bottom:14px}
@keyframes salta{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
// Código Python que se carga una vez: ejecuta programas con un límite de tiempo (así un bucle infinito no congela la página)
// y ofrece correr(), que los retos usan para probar el código del alumno con otros valores.
const RUNNER = `
def _ejecutar_limitado(src, ns, limite=3.0):
    import sys, time
    fin = time.time() + limite
    def traza(frame, evento, arg):
        if evento == 'line' and time.time() > fin:
            raise TimeoutError('El programa tardó demasiado en terminar. ¿Hay un bucle que nunca se detiene?')
        return traza
    sys.settrace(traza)
    try:
        exec(compile(src, '<exec>', 'exec'), ns)
    finally:
        sys.settrace(None)

def correr(src):
    import io, contextlib
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf):
        _ejecutar_limitado(src, {}, 2.0)
    return buf.getvalue().strip()
`;

/* ================= CONTENIDO ================= */
const UNIDADES = [
{
  id: 'intro', titulo: 'Introducción', desc: 'Qué es programar y cómo escribir tu primer programa.',
  lecciones: [
    { id: 'intro-1', titulo: '¿Qué es programar?', pasos: [
      { tipo: 'teoria', titulo: 'Dar instrucciones a la computadora', bloques: [
        ['p', 'Un <b>programa</b> es una lista de instrucciones que la computadora sigue una por una, sin adivinar nada. <b>Python</b> es un lenguaje para escribir esas instrucciones, y es de los más fáciles de leer.'],
        ['p', 'Se usa para páginas web, análisis de datos, inteligencia artificial y para automatizar tareas aburridas.'],
        ['code', `print("Hola")\nprint("¿Cómo estás?")`],
        ['out', `Hola\n¿Cómo estás?`],
        ['p', 'Python lee el programa de <b>arriba hacia abajo</b>, línea por línea. <code>print()</code> significa «mostrar en pantalla».']
      ]},

let ac = null;
function audio() {
  if (!est.sonido) return null;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tono(freq, inicio, dur, tipo = 'sine', vol = 0.16) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime + inicio;
  const o = a.createOscillator(), g = a.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// Se puede llamar varias veces: si un intento anterior falló (por ejemplo, sin internet), vuelve a intentarlo
function cargarPython() {
  if (pyEstado === 'cargando' || pyEstado === 'listo') return;

function traducirError(msg) {
  const l = String(msg).trim().split('\n').filter(Boolean);
  const ultima = l[l.length - 1] || 'Error';
  let linea = null;
  for (const t of l) { const m = t.match(/File "<exec>", line (\d+)/); if (m) linea = m[1]; }
  let ayuda = '', m;
  if ((m = ultima.match(/^NameError: name '(.+)' is not defined/))) ayuda = `Python no conoce el nombre «${m[1]}». Revisa que lo hayas creado antes y que esté escrito igual, con las mismas mayúsculas.`;
  else if (/^IndentationError/.test(ultima)) ayuda = 'Revisa la sangría: las líneas dentro de un if, elif o else llevan 4 espacios al inicio (usa la tecla Tab) y las demás, ninguno.';
  else if (/^SyntaxError: expected ':'/.test(ultima)) ayuda = 'Falta el signo : (dos puntos) al final de la línea del if, elif o else.';
  else if (/^SyntaxError/.test(ultima)) ayuda = 'Hay un error de escritura: revisa que las comillas y los paréntesis estén cerrados.';
  else if (/^TimeoutError/.test(ultima)) ayuda = 'Tu programa no termina. Revisa que la condición del while llegue a ser falsa (por ejemplo, que el contador cambie dentro del bucle).';
  else if (/^TypeError/.test(ultima)) ayuda = 'Estás mezclando valores que no se pueden combinar así, por ejemplo texto con números.';
  return { ultima, linea, ayuda };
}

async function ejecutar(codigo) {
  const lineas = [];
  let recortada = false;
  const guardarLinea = s => { if (lineas.length < 300) lineas.push(s); else recortada = true; };
  py.setStdout({ batched: guardarLinea });
  py.setStderr({ batched: guardarLinea });
  const ns = py.runPython('dict()');
  let error = null;
  const ejec = py.globals.get('_ejecutar_limitado');
  try { ejec(codigo, ns); }
  catch (e) { error = traducirError(e.message || e); }
  finally { ejec.destroy(); }
  if (recortada) lineas.push('… (salida recortada)');
  try { py.runPython('import sys\nsys.stdout.flush()'); } catch (e) {}
  return { salida: lineas.join('\n'), error, ns };
}

function mostrarSalida(r) {
  const box = $('#salida'), tx = $('#salidaTx');
  if (!box || !tx) return;
  box.classList.toggle('err', !!r.error);
  let t = r.salida;
  if (r.error) {
    t += (t ? '\n' : '') + (r.error.linea ? `Línea ${r.error.linea}: ` : '') + r.error.ultima;
    if (r.error.ayuda) t += '\n\n' + r.error.ayuda;
  }
  tx.textContent = t || '(Sin salida. Usa print() para mostrar algo.)';
}

      <button class="enlace" id="btnIntro">Ver introducción</button> · <button class="enlace" id="btnReiniciar">Reiniciar progreso</button>${location.protocol === 'file:' ? '<br><br>Abriste el archivo directamente: si abres una versión nueva, el progreso no se traslada solo. Usa «Guardar o recuperar progreso» antes de cambiar de versión.' : ''}</p>`;
  actualizarSonido();
  requestAnimationFrame(dibujarTrazo);
}

// Despliega o pliega una unidad sin volver a dibujar toda la ruta (así no se pierde el lugar en la pantalla)
function fijarUnidad(id, abrir) {
  const cont = $('#u-' + id), cab = document.querySelector('[data-toggle="' + id + '"]');
  if (!cont || !cab) return;
  cont.hidden = !abrir;
  cab.setAttribute('aria-expanded', String(abrir));
  est.abiertas = { ...est.abiertas, [id]: abrir };
}
function alternarUnidad(id) {
  const cont = $('#u-' + id);
  if (!cont) return;
  fijarUnidad(id, cont.hidden);
  guardar();
  dibujarTrazo();
}
function plegarTodo(abrir) {
  UNIDADES.forEach(u => fijarUnidad(u.id, abrir));
  guardar();
  dibujarTrazo();
}

function dibujarTrazo() {
  const r = $('#ruta'), svg = $('#trazo');
  if (!r || !svg) return;
  const base = r.getBoundingClientRect();
  // Solo se dibuja el camino entre lecciones visibles de una misma unidad
  const pts = [...r.querySelectorAll('.u-lecs:not([hidden]) .nodo')].map(nodo => {
    const b = nodo.querySelector('.hexw').getBoundingClientRect();
    return { u: nodo.dataset.unidad, i: +nodo.dataset.leccion, x: b.left - base.left + b.width / 2, y: b.top - base.top + b.height / 2 };
  });
  let d = '';
  for (let k = 0; k < pts.length - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    if (a.u !== b.u) continue;
    const m = (a.y + b.y) / 2;
    const hecho = est.completadas.includes(LECCIONES[a.i].id);
    d += `<path class="${hecho ? 'hecho' : ''}" d="M${a.x} ${a.y} C${a.x} ${m} ${b.x} ${m} ${b.x} ${b.y}"/>`;
  }
  svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
  svg.innerHTML = d;
}

function mezclar(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// Cada intento del quiz mezcla el orden de las preguntas y el de las opciones
function prepararQuiz(lec) {
  return mezclar(lec.pasos).map(p => {
    const orden = mezclar(p.opciones.map((_, k) => k));
    return { ...p, opciones: orden.map(k => p.opciones[k]), correcta: orden.indexOf(p.correcta) };
  });
}

/* ===== Copia de seguridad del progreso =====
   El navegador guarda el progreso por "sitio". Cada archivo nuevo que se abre (o una copia con otro nombre) cuenta como un sitio distinto
   y empieza de cero. Con este código se puede llevar el progreso de una versión a otra. */
function codigoProgreso() {
  const d = { v: 1, completadas: est.completadas, xp: est.xp, racha: est.racha, ultimoDia: est.ultimoDia, abiertas: est.abiertas };
  return 'CP1-' + btoa(JSON.stringify(d));
}

function leerCodigo(txt) {
  const t = String(txt).replace(/\s+/g, '');
  if (!t.startsWith('CP1-')) throw new Error('El código debe empezar con CP1-. Cópialo completo.');
  let d;
  try { d = JSON.parse(atob(t.slice(4))); } catch (e) { throw new Error('El código no es válido. Revisa que lo hayas copiado completo.'); }
  if (!d || !Array.isArray(d.completadas)) throw new Error('El código no trae datos de progreso.');
  const ids = new Set(LECCIONES.map(l => l.id));
  return {
    completadas: d.completadas.filter(x => ids.has(x)),
    xp: Math.max(0, Number(d.xp) || 0),
    racha: Math.max(0, Number(d.racha) || 0),
    ultimoDia: typeof d.ultimoDia === 'string' ? d.ultimoDia : null
  };
}

// Une el progreso del código con el que ya hay: nunca se pierde nada
function aplicarProgreso(d) {
  est.completadas = [...new Set([...est.completadas, ...d.completadas])];
  est.xp = Math.max(est.xp, d.xp);
  if (!est.ultimoDia || (d.ultimoDia && d.ultimoDia > est.ultimoDia)) { est.racha = d.racha; est.ultimoDia = d.ultimoDia; }
  est.intro = true;
  guardar();
}

function renderCopia() {
  $('#app').innerHTML = `
    <main class="copia">
      <h1>Guardar o recuperar tu progreso</h1>
      <p>Tu avance se guarda en este navegador, y cada archivo nuevo que abres cuenta como un sitio distinto, por eso a veces empiezas de cero. Con un código puedes llevar tu progreso a cualquier versión.</p>
      <h2>1. Guardar</h2>
      <p>Copia este código y guárdalo en un lugar seguro (por ejemplo, en tus notas).</p>
      <textarea id="codigoProg" class="cuadro" readonly rows="4" aria-label="Tu código de progreso">${esc(codigoProgreso())}</textarea>
      <button class="btn2" id="btnCopiar" style="width:100%;margin:10px 0 24px">Copiar código</button>
      <h2>2. Recuperar</h2>
      <p>Pega aquí un código que guardaste antes. Se suma a lo que ya tengas, no se borra nada.</p>
      <textarea id="codigoIn" class="cuadro" rows="4" placeholder="CP1-..." spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Pega aquí tu código de progreso"></textarea>
      <button class="btn" id="btnAplicar" style="margin:12px 0">Recuperar progreso</button>
      <div id="msgCopia" role="status" class="msg"></div>
      <button class="btn2" id="btnRuta" style="width:100%;margin-top:6px">Volver a la ruta</button>
    </main>`;
}

function mensajeCopia(tipo, txt) {
  const m = $('#msgCopia');
  if (m) { m.className = 'msg ' + tipo; m.textContent = txt; }
}

async function copiarRapido() {
  let ok = false;
  try { await navigator.clipboard.writeText(codigoProgreso()); ok = true; } catch (e) {}
  const b = $('#btnCopiarFin');
  if (!ok) { vista = 'copia'; return render(); }   // si el portapapeles no está disponible, se muestra el código para copiarlo a mano
  if (b) b.textContent = 'Código copiado. Pégalo en tus notas';
}

async function copiarCodigo() {
  const ta = $('#codigoProg');
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
  if (!ok) { try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) {} }
  mensajeCopia(ok ? 'ok' : 'mal', ok ? 'Código copiado.' : 'No se pudo copiar solo. Mantén pulsado el código, elige «Seleccionar todo» y copia.');
}

function recuperarCodigo() {
  try {
    const d = leerCodigo($('#codigoIn').value);
    const antes = est.completadas.length;
    aplicarProgreso(d);
    mensajeCopia('ok', 'Progreso recuperado: ' + est.completadas.length + ' lecciones completadas y ' + est.xp + ' puntos.' + (est.completadas.length === antes ? ' (Ya lo tenías.)' : ''));
    $('#codigoProg').value = codigoProgreso();
  } catch (e) { mensajeCopia('mal', e.message); }
}

function abrirLeccion(i) {
  const lec = LECCIONES[i];
  // repasoLibre: lección ya completada, se puede navegar por todos sus pasos y entre lecciones
  L = { i, p: 0, max: 0, aciertos: 0, pasos: lec.esQuiz ? prepararQuiz(lec) : lec.pasos, codigos: {}, ok: new Set(),
        repasoLibre: !lec.esQuiz && est.completadas.includes(lec.id) };
  nuevoPaso();
  vista = 'leccion';
  cargarPython();
  render();
}

function nuevoPaso() {
  Object.assign(L, { sel: null, respondido: false, correcto: false, pistas: 0, verSol: false });
}

const paso = () => L.pasos[L.p];

function renderLeccion() {
  $('#app').innerHTML = `
    <div class="lec-top">
      <div class="lec-fila">
        <button class="cerrar" id="btnCerrar" aria-label="Salir de la lección">${IC.x}</button>
        <div class="progreso" id="segs" role="group" aria-label="Pasos de la lección"></div>
        <button class="snd" id="btnSonido"></button>
      </div>
      <div id="navlec"></div>
    </div>
    <main class="hoja" id="hoja"></main>
    <footer class="pie"><div class="pie-in"><div id="fb"></div><button class="btn" id="btnPrincipal"></button></div></footer>`;
  actualizarSonido();
  pintarPaso();
}

function bloque(b) {
  if (b[0] === 'p') return `<p>${b[1]}</p>`;
  if (b[0] === 'code') return `<pre class="cod"><code>${esc(b[1])}</code></pre>`;
  return `<div class="sal"><span class="etq">Salida</span><pre>${esc(b[1])}</pre></div>`;
}

// Lección vecina a la que se puede ir: solo lecciones completadas o la que toca ahora (los quiz se saltan)
function vecina(i, dir) {
  const actual = LECCIONES.findIndex(l => !est.completadas.includes(l.id));
  for (let j = i + dir; j >= 0 && j < LECCIONES.length; j += dir) {
    if (LECCIONES[j].esQuiz) continue;
    return (est.completadas.includes(LECCIONES[j].id) || j === actual) ? j : -1;
  }
  return -1;
}
const numLeccion = i => LECCIONES.slice(0, i + 1).filter(l => !l.esQuiz).length;

function pintarNav() {
  const cont = $('#navlec');
  if (!cont) return;
  if (!L.repasoLibre) { cont.innerHTML = ''; return; }
  const ant = vecina(L.i, -1), sig = vecina(L.i, 1);
  const et = j => j < 0 ? 'No hay más lecciones en esa dirección' : 'Lección ' + numLeccion(j) + ': ' + LECCIONES[j].titulo;
  cont.innerHTML = `<div class="lec-nav">
    <button class="nav-flecha" id="btnLecAnt" data-lec="${ant}" ${ant < 0 ? 'disabled' : ''} aria-label="Lección anterior. ${esc(et(ant))}">${IC.izq}</button>
    <div class="lec-nav-tit"><b>Lección ${numLeccion(L.i)}: ${esc(LECCIONES[L.i].titulo)}</b><small>Repaso: toca la barra para saltar de paso</small></div>
    <button class="nav-flecha" id="btnLecSig" data-lec="${sig}" ${sig < 0 ? 'disabled' : ''} aria-label="Lección siguiente. ${esc(et(sig))}">${IC.der}</button>
  </div>`;
}

function irAPaso(k) {
  const lec = LECCIONES[L.i];
  if (lec.esQuiz || k === L.p || !(L.repasoLibre || k <= L.max)) return;
  L.p = k; nuevoPaso(); pintarPaso(); window.scrollTo(0, 0);
}

function pintarPaso() {
  const lec = LECCIONES[L.i], p = paso();
  $('#segs').innerHTML = L.pasos.map((_, k) => {
    const puede = !lec.esQuiz && (L.repasoLibre || k <= L.max);
    const estadoSeg = k === L.p ? 'actual' : (L.repasoLibre || k < L.p) ? 'hecho' : '';
    return `<button class="seg-b ${estadoSeg}" data-paso="${k}" ${puede && k !== L.p ? '' : 'disabled'} aria-label="Paso ${k + 1} de ${L.pasos.length}${k === L.p ? ', actual' : ''}"><i></i></button>`;
  }).join('');
  pintarNav();
  let h = '';
  if (p.tipo === 'teoria') {
    h = `<h1>${esc(p.titulo)}</h1>` + p.bloques.map(bloque).join('');
  } else if (p.tipo === 'quiz') {
    h = `<h1>${lec.esQuiz ? 'Pregunta ' + (L.p + 1) + ' de ' + L.pasos.length : 'Pregunta rápida'}</h1>`
      + (p.codigo ? `<pre class="cod"><code>${esc(p.codigo)}</code></pre>` : '')
      + `<p class="preg">${esc(p.pregunta)}</p>`
      + `<div class="ops">${p.opciones.map((o, k) => `<button class="op" data-op="${k}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`;
  } else {
    h = `<h1>${esc(p.titulo)}</h1><p>${p.enunciado}</p>
      <div class="sobre">
        <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off" aria-label="Editor de código Python">${esc(L.codigos[L.p] ?? p.inicial)}</textarea>
        <div class="teclas" role="toolbar" aria-label="Símbolos rápidos">${TECLAS.map(t => `<button type="button" class="tecla" data-tecla="${esc(t.v)}" aria-label="${esc(t.n)}">${esc(t.l)}</button>`).join('')}</div>
      </div>
      <div class="acciones"><button class="btn2" id="btnEj" disabled>Ejecutar</button><button class="btn2" id="btnPista">Pista</button></div>
      <div class="sal" id="salida"><span class="etq">Salida</span><pre id="salidaTx">Aún no has ejecutado nada.</pre></div>
      <div id="pistas"></div>
      <p class="estado" id="estadoPy"></p>`;
  }
  $('#hoja').innerHTML = h;
  $('#fb').innerHTML = '';
  const b = $('#btnPrincipal');
  b.className = 'btn';
  if (p.tipo === 'teoria') { b.textContent = 'Continuar'; b.disabled = false; }
  else if (p.tipo === 'quiz') { b.textContent = 'Comprobar'; b.disabled = true; }
  else { b.textContent = 'Comprobar'; b.disabled = false; estadoPy(); }
}

function setFb(tipo, titulo, texto) {
  $('#fb').innerHTML = `<div class="fb ${tipo}" role="status"><div><b>${esc(titulo)}</b>${texto ? esc(texto) : ''}</div></div>`;
}

function accionPrincipal() {
  const p = paso();
  if (p.tipo === 'teoria') return siguiente();
  if (p.tipo === 'quiz') return L.respondido ? siguiente() : comprobarQuiz();
  return L.correcto ? siguiente() : comprobarReto();
}

function siguiente() {
  if (L.p < L.pasos.length - 1) { L.p++; L.max = Math.max(L.max, L.p); nuevoPaso(); pintarPaso(); window.scrollTo(0, 0); }
  else terminar();
}

function elegirOpcion(k) {
  if (L.respondido) return;
  L.sel = k;
  SONIDO.tic();
  document.querySelectorAll('.op').forEach(o => o.setAttribute('aria-pressed', String(+o.dataset.op === k)));
  $('#btnPrincipal').disabled = false;
}

function comprobarQuiz() {
  const p = paso();
  L.respondido = true;
  L.ok.add(L.p);
  const bien = L.sel === p.correcta;
  if (bien) L.aciertos++;
  document.querySelectorAll('.op').forEach(o => {
    const k = +o.dataset.op;
    o.disabled = true;
    if (k === p.correcta) o.classList.add('ok');
    else if (k === L.sel) o.classList.add('mal');
  });
  (bien ? SONIDO.ok : SONIDO.mal)();
  setFb(bien ? 'ok' : 'mal', bien ? '¡Correcto!' : 'No es esa.', ' ' + p.explicacion);
  const b = $('#btnPrincipal');
  b.textContent = 'Continuar';
  b.classList.toggle('ok', bien);
}

async function botonEjecutar() {
  if (pyEstado !== 'listo') return;
  const r = await ejecutar($('#editor').value);
  r.ns.destroy();
  mostrarSalida(r);
}

async function comprobarReto() {
  const p = paso();
  if (pyEstado !== 'listo') {
    setFb('mal', pyEstado === 'error' ? 'Python no está disponible.' : 'Python todavía no está listo.',
      pyEstado === 'error' ? ' Revisa tu conexión y toca Reintentar debajo de la salida.' : ' Espera un momento y vuelve a comprobar.');
    return;
  }
  const codigo = $('#editor').value;
  const r = await ejecutar(codigo);
  mostrarSalida(r);
  if (r.error) { r.ns.destroy(); SONIDO.mal(); setFb('mal', 'Tu código tiene un error.', ' Corrígelo y vuelve a comprobar.'); return; }
  r.ns.set('salida', r.salida);
  r.ns.set('codigo', codigo);
  const fnCorrer = py.globals.get('correr');
  r.ns.set('correr', fnCorrer);
  fnCorrer.destroy();
  let fallo = null;
  for (const c of p.checks) {
    let ok = false;
    try { ok = py.runPython(`bool(${c.py})`, { globals: r.ns }) === true; } catch (e) { ok = false; }
    if (!ok) { fallo = c.msg; break; }
  }
  r.ns.destroy();
  if (fallo) { SONIDO.mal(); setFb('mal', 'Casi.', ' ' + fallo); return; }
  L.correcto = true;
  L.ok.add(L.p);
  SONIDO.ok();
  setFb('ok', '¡Reto superado!', ' Tu código hace lo que pedía el enunciado.');
  const b = $('#btnPrincipal');
  b.textContent = 'Continuar';
  b.classList.add('ok');
}

function pista() {
  const p = paso();
  if (L.pistas < p.pistas.length) L.pistas++;
  else L.verSol = true;
  let h = '';
  for (let k = 0; k < L.pistas; k++) h += `<div class="pista">Pista ${k + 1}: ${esc(p.pistas[k])}</div>`;
  if (L.verSol) h += `<div class="pista">Una solución posible:<pre class="cod">${esc(p.solucion)}</pre></div>`;
  $('#pistas').innerHTML = h;
  const b = $('#btnPista');
  if (L.verSol) { b.textContent = 'Pista'; b.disabled = true; }
  else if (L.pistas >= p.pistas.length) b.textContent = 'Ver solución';
}

function insertar(txt) {
  const ed = $('#editor');
  if (!ed) return;
  const a = ed.selectionStart, b = ed.selectionEnd;
  ed.value = ed.value.slice(0, a) + txt + ed.value.slice(b);
  ed.selectionStart = ed.selectionEnd = a + txt.length;
  ed.focus();
  L.codigos[L.p] = ed.value;
}

function actualizarRacha() {
  const hoyStr = hoy();
  if (est.ultimoDia !== hoyStr) { est.racha = est.ultimoDia === ayer() ? est.racha + 1 : 1; est.ultimoDia = hoyStr; }
}

/* ===== Meta diaria y cofre sorpresa ===== */
const METAS = [{ pts: 30, nombre: 'Suave' }, { pts: 50, nombre: 'Normal' }, { pts: 100, nombre: 'Intensa' }];
const nombreMeta = () => (METAS.find(m => m.pts === est.meta) || { nombre: 'Personal' }).nombre;

// Puntos de hoy: se reinician solos cuando cambia el día
function hoyEst() {
  const d = hoy();
  if (!est.hoy || est.hoy.dia !== d) est.hoy = { dia: d, xp: 0, cofre: null };
  return est.hoy;
}

// Al llegar a la meta, el cofre queda "pendiente" hasta que se abra
function revisarMeta() {
  const h = hoyEst();
  if (h.xp >= est.meta && !h.cofre) {
    h.cofre = 'pendiente';
    est.metasCumplidas = (est.metasCumplidas || 0) + 1;
    est.rachaMeta = est.ultimaMeta === ayer() ? (est.rachaMeta || 0) + 1 : 1;
    est.ultimaMeta = hoy();
  }
}

function sumarPuntos(n) {
  if (n <= 0) return;
  est.xp += n;
  hoyEst().xp += n;
  revisarMeta();
}

function cambiarMeta() {
  const i = METAS.findIndex(m => m.pts === est.meta);
  est.meta = METAS[(i + 1) % METAS.length].pts;
  revisarMeta();
  guardar();
  render();
}

const rachaMetaVigente = () => (est.ultimaMeta === hoy() || est.ultimaMeta === ayer()) ? (est.rachaMeta || 0) : 0;

function anilloMeta() {
  const h = hoyEst();
  const pct = Math.min(1, h.xp / est.meta);
  const C = 2 * Math.PI * 26;
  return `<svg class="anillo" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Meta diaria: ${Math.min(h.xp, est.meta)} de ${est.meta} puntos">
    <circle cx="36" cy="36" r="26" fill="none" stroke="var(--rejilla)" stroke-width="9"/>
    <circle cx="36" cy="36" r="26" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}" transform="rotate(-90 36 36)"/>
    <text x="36" y="41" text-anchor="middle" font-size="16" font-weight="800" fill="currentColor">${Math.round(pct * 100)}%</text>
  </svg>`;
}

function tarjetaMeta() {
  const h = hoyEst();
  const hecha = h.xp >= est.meta;
  const rc = rachaMetaVigente();
  const cta = h.cofre === 'pendiente' ? '<button class="btn-cofre" id="btnCofre">¡Abrir cofre sorpresa!</button>'
    : h.cofre === 'abierto' ? '<span class="tag-ok">Cofre de hoy abierto</span>' : '';
  return `<section class="meta">
    ${anilloMeta()}
    <div class="meta-txt"><b>Meta de hoy</b>
      <span>${hecha ? '¡Cumplida!' : h.xp + ' de ' + est.meta + ' puntos'}</span>
      <button class="enlace" id="btnMeta" style="padding-left:0">Meta ${nombreMeta()}: cambiar</button>
      ${est.metasCumplidas > 0 ? `<small>Metas cumplidas: ${est.metasCumplidas}${rc >= 2 ? ' · ' + rc + ' días seguidos' : ''}</small>` : ''}
    </div>
    ${cta}
  </section>`;
}

function bloqueMetaFin() {
  const h = hoyEst();
  if (h.cofre === 'pendiente') return `<div class="meta-fin"><b>¡Cumpliste tu meta de hoy!</b><button class="btn-cofre" id="btnCofre">¡Abrir cofre sorpresa!</button></div>`;
  if (h.xp < est.meta) return `<p class="meta-fin-txt">Meta de hoy: ${h.xp} de ${est.meta} puntos</p>`;
  return '';
}

// Recompensa variable: casi siempre pequeña, a veces grande
function sortearPremio() {
  const r = Math.random();
  if (r < 0.05) return { xp: 50, tipo: 'dorado', nombre: '¡Cofre dorado!' };
  if (r < 0.20) return { xp: 30, tipo: 'raro', nombre: 'Cofre raro' };
  if (r < 0.55) return { xp: 20, tipo: 'bueno', nombre: 'Cofre bueno' };
  return { xp: 10, tipo: 'comun', nombre: 'Cofre común' };
}

const SVG_COFRE = `<svg viewBox="0 0 160 140" aria-hidden="true">
  <defs><radialGradient id="gl"><stop offset="0" stop-color="#FFE066" stop-opacity=".95"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient></defs>
  <circle id="brillo" cx="80" cy="66" r="76" fill="url(#gl)"/>
  <ellipse cx="80" cy="130" rx="62" ry="8" fill="#17246B" opacity=".18"/>
  <rect x="20" y="60" width="120" height="66" rx="8" fill="#FFC21A" stroke="#17246B" stroke-width="4"/>
  <rect x="72" y="60" width="16" height="66" fill="#FFE066" stroke="#17246B" stroke-width="4"/>
  <g id="tapa">
    <path d="M20 60V46a26 26 0 0 1 26-26h68a26 26 0 0 1 26 26v14z" fill="#FFE066" stroke="#17246B" stroke-width="4" stroke-linejoin="round"/>
    <rect x="72" y="20" width="16" height="40" fill="#FFC21A" stroke="#17246B" stroke-width="4"/>
  </g>
  <rect x="68" y="54" width="24" height="24" rx="5" fill="#17246B"/>
  <circle cx="80" cy="64" r="4" fill="#FFE066"/>
  <g class="chispas" fill="#FFC21A" stroke="#17246B" stroke-width="2" stroke-linejoin="round">
    <path style="animation-delay:.05s" d="M22 24l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <path style="animation-delay:.15s" d="M138 14l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path style="animation-delay:.25s" d="M148 70l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
    <path style="animation-delay:.35s" d="M8 78l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
  </g>
</svg>`;

function renderCofre() {
  const pendiente = hoyEst().cofre === 'pendiente';
  $('#app').innerHTML = `
    <main class="cofre" id="cofre">
      <h1>${pendiente ? '¡Meta cumplida!' : 'Cofre de hoy'}</h1>
      <p id="cofreTxt">${pendiente ? 'Lo lograste. Toca el cofre para ver tu sorpresa.' : 'Hoy ya abriste tu cofre. Mañana habrá otro si cumples tu meta.'}</p>
      <button class="cofre-btn" id="btnAbrirCofre" aria-label="Abrir el cofre sorpresa" ${pendiente ? '' : 'disabled'}>${SVG_COFRE}</button>
      <div id="premio" role="status"></div>
      <button class="btn" id="btnRuta" style="${pendiente ? 'display:none' : ''}">Volver a la ruta</button>
    </main>`;
}

function abrirCofre() {
  const h = hoyEst();
  if (h.cofre !== 'pendiente') return;
  const premio = sortearPremio();
  est.xp += premio.xp;          // el bonus suma a tu total, pero no cuenta para la meta de hoy
  h.cofre = 'abierto';
  guardar();
  $('#cofre').classList.add('abierto');
  $('#btnAbrirCofre').disabled = true;
  $('#tapa').classList.add('abierta');
  $('#cofreTxt').textContent = '¡Sorpresa!';
  $('#premio').innerHTML = `<div class="premio ${premio.tipo}"><strong>+${premio.xp}</strong><span>puntos · ${premio.nombre}</span></div>`;
  $('#btnRuta').style.display = 'block';
  (premio.tipo === 'dorado' ? SONIDO.cofreDorado : SONIDO.cofre)();
}

function terminar() {
  const lec = LECCIONES[L.i];
  const yaHecha = est.completadas.includes(lec.id);
  L.ganado = 0;
  L.repaso = yaHecha;
  L.saltos = false;
  if (lec.esQuiz) {
    L.total = L.pasos.length;
    L.necesarios = Math.ceil(L.total * 0.7);
    L.aprobado = L.aciertos >= L.necesarios;
    if (L.aprobado) { L.ganado = yaHecha ? 15 : 50; if (!yaHecha) est.completadas.push(lec.id); }
  } else {
    // Al repasar, los puntos solo se dan si se resolvieron todos los pasos (no si se saltaron con la barra)
    const completo = L.pasos.every((p, k) => p.tipo === 'teoria' || L.ok.has(k));
    L.saltos = yaHecha && !completo;
    L.ganado = yaHecha ? (completo ? 10 : 0) : 30;
    if (!yaHecha) est.completadas.push(lec.id);
  }
  sumarPuntos(L.ganado);
  actualizarRacha();
  guardar();
  vista = 'fin';
  render();
  (lec.esQuiz && !L.aprobado ? SONIDO.mal : SONIDO.fin)();
}

function renderFin() {
  const lec = LECCIONES[L.i];
  const sig = LECCIONES[L.i + 1];
  const u = UNIDADES.find(x => x.id === lec.unidad);
  const racha = `<div><strong>${rachaVigente()}</strong><span>${rachaVigente() === 1 ? 'día seguido' : 'días seguidos'}</span></div>`;
  const puntos = `<div><strong>${L.ganado > 0 ? '+' + L.ganado : '0'}</strong><span>${L.ganado > 0 ? (L.repaso ? 'puntos por repasar' : 'puntos ganados') : (L.saltos ? 'sin puntos: te saltaste pasos' : 'sin puntos')}</span></div>`;
  const meta = bloqueMetaFin();
  if (lec.esQuiz) {
    const ok = L.aprobado;
    $('#app').innerHTML = `
      <main class="fin">
        <span class="hexw"><span class="hex ${ok ? '' : 'flojo'}"><i>${L.aciertos}/${L.total}</i></span></span>
        <h1>${ok ? '¡Quiz aprobado!' : 'Casi lo logras'}</h1>
        <p>${ok ? 'Acertaste ' + L.aciertos + ' de ' + L.total + ' y terminaste «' + esc(u.titulo) + '». Buen trabajo.'
               : 'Acertaste ' + L.aciertos + ' de ' + L.total + '. Necesitas ' + L.necesarios + ' para aprobar. Repasa y vuelve a intentarlo: las preguntas cambian de orden.'}</p>
        <div class="res">
          ${ok ? puntos : `<div><strong>${L.aciertos}</strong><span>aciertos</span></div>`}
          ${ok ? racha : `<div><strong>${L.necesarios}</strong><span>para aprobar</span></div>`}
        </div>
        ${meta}
        ${ok && sig ? `<button class="btn" id="btnSig">Siguiente lección</button>` : ''}
        ${ok ? '' : `<button class="btn" id="btnReintentar">Intentar de nuevo</button>`}
        <button class="btn2" id="btnRuta" style="width:100%;margin-bottom:10px">Volver a la ruta</button>
        <button class="btn2" id="btnCopiarFin" style="width:100%">Copiar mi código de progreso</button>
      </main>`;
    return;
  }
  $('#app').innerHTML = `
    <main class="fin">
      <span class="hexw"><span class="hex"><i>${IC.check}</i></span></span>
      <h1>¡Lección completada!</h1>
      <p>${esc(lec.titulo)}</p>
      <div class="res">${puntos}${racha}</div>
      ${meta}
      ${sig ? `<button class="btn" id="btnSig">${sig.esQuiz ? 'Ir al quiz de la unidad' : 'Siguiente lección'}</button>` : ''}
      <button class="btn2" id="btnRuta" style="width:100%;margin-bottom:10px">Volver a la ruta</button>
      <button class="btn2" id="btnCopiarFin" style="width:100%">Copiar mi código de progreso</button>
    </main>`;
}

/* ================= EVENTOS ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  audio(); // crea o reanuda el audio dentro de un toque del usuario
  if (t.classList.contains('snd') && t.id === 'btnSonido') return alternarSonido();
  if (t.dataset.paso !== undefined) return irAPaso(+t.dataset.paso);
  if (t.dataset.lec !== undefined) return t.dataset.lec >= 0 ? abrirLeccion(+t.dataset.lec) : undefined;
  if (t.dataset.toggle !== undefined) return alternarUnidad(t.dataset.toggle);
  if (t.dataset.acc !== undefined) return plegarTodo(t.dataset.acc === 'abrir');
  if (t.dataset.leccion !== undefined) return abrirLeccion(+t.dataset.leccion);
  if (t.dataset.op !== undefined) return elegirOpcion(+t.dataset.op);
  if (t.dataset.tecla !== undefined) return insertar(t.dataset.tecla);
  switch (t.id) {
    case 'btnPrincipal': return accionPrincipal();
    case 'btnEj': return botonEjecutar();
    case 'btnPista': return pista();
    case 'btnCofre': vista = 'cofre'; return render();
    case 'btnAbrirCofre': return abrirCofre();
    case 'btnMeta': return cambiarMeta();
    case 'btnCopia': vista = 'copia'; return render();
    case 'btnCopiar': return copiarCodigo();
    case 'btnCopiarFin': return copiarRapido();
    case 'btnAplicar': return recuperarCodigo();
    case 'btnReintentarPy': return cargarPython();
    case 'btnCerrar': vista = 'ruta'; return render();
    case 'btnRuta': vista = 'ruta'; return render();
    case 'btnSig': return abrirLeccion(L.i + 1);
    case 'btnReintentar': return abrirLeccion(L.i);
    case 'btnSonidoBv': return alternarSonido();
    case 'btnProbar': SONIDO.ok(); setTimeout(SONIDO.mal, 650); return;
    case 'btnBvSaltar': bv = BV_PAGES.length - 1; return render();
    case 'btnBvSig':
      if (bv < BV_PAGES.length - 1) { bv++; return render(); }
      est.intro = true; guardar(); vista = 'ruta'; return render();
    case 'btnIntro': bv = 0; vista = 'bienvenida'; return render();
    case 'btnReiniciar':
      if (confirm('¿Borrar todo tu progreso en este navegador?')) {
        est = { completadas: [], xp: 0, racha: 0, ultimoDia: null, sonido: est.sonido, intro: true, abiertas: {}, meta: est.meta, hoy: null, metasCumplidas: 0, rachaMeta: 0, ultimaMeta: null };
        guardar(); render();
      }
      return;
  }
});

// Evita que los botones de símbolos le quiten el foco al editor (así no se cierra el teclado)
document.addEventListener('mousedown', e => { if (e.target.closest('.tecla')) e.preventDefault(); });

document.addEventListener('input', e => { if (e.target.id === 'editor' && L) L.codigos[L.p] = e.target.value; });

document.addEventListener('keydown', e => {
  if (e.target.id !== 'editor') return;
  if (e.key === 'Escape') { tabLibre = true; return; }
  if (e.key === 'Tab' && !e.shiftKey) {
    if (tabLibre) { tabLibre = false; return; }
    e.preventDefault(); insertar('    ');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); botonEjecutar(); }
});

// Sangría automática: al pulsar Enter conserva la sangría y suma 4 espacios tras una línea que termina en :
document.addEventListener('beforeinput', e => {
  if (e.target.id !== 'editor' || e.inputType !== 'insertLineBreak') return;
  e.preventDefault();
  const ed = e.target;
  const antes = ed.value.slice(0, ed.selectionStart);
  const linea = antes.slice(antes.lastIndexOf('\n') + 1);
  let sangria = (linea.match(/^ */) || [''])[0];
  if (/:\s*$/.test(linea.split('#')[0])) sangria += '    ';
  insertar('\n' + sangria);
});

window.addEventListener('resize', () => { if (vista === 'ruta') dibujarTrazo(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (vista === 'ruta') dibujarTrazo(); });

render();
})();
</script>
